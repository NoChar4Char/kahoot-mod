<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizlet to Flashcard Mod Converter</title>
<style>
/* Beautiful Dark Mode Glassmorphism UI */
body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.container {
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    border-radius: 16px;
    padding: 40px;
    width: 600px;
}
textarea {
    width: 100%;
    height: 150px;
    background: #0f172a;
    border: 1px solid #334155;
    color: #f8fafc;
    padding: 12px;
    border-radius: 8px;
    font-family: monospace;
    resize: none;
    box-sizing: border-box;
    margin-bottom: 20px;
}
button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
    width: 100%;
}
button:hover {
    background: #2563eb;
}
</style>
</head>
<body>
<div class="container">
<h1>📚 Flashcard Converter</h1>
<p>Paste your <b>Quizlet / Anki</b> export below. <br>Format: <code>Question [Tab] Answer</code></p>
<textarea id="input" placeholder="Question 1&#9;Answer 1&#10;Question 2&#9;Answer 2"></textarea>
<button onclick="convert()">Download flashcards.json</button>
</div>
<script>
function convert() {
    const text = document.getElementById('input').value;
    const lines = text.split('\n');
    const cards = [];
    
    // Parse input
    for (let line of lines) {
        if (!line.trim()) continue;
        const parts = line.split('\t');
        if (parts.length >= 2) {
            cards.push({q: parts[0].trim(), a: parts[1].trim()});
        } else {
            // fallback if using hyphens
            const split = line.split(' - ');
            if (split.length >= 2) {
                cards.push({q: split[0].trim(), a: split[1].trim()});
            }
        }
    }
    
    if (cards.length < 4) {
        alert("You need at least 4 flashcards to successfully generate Multiple-Choice options!");
        return;
    }
    
    // Generate JSON Mod schema
    const output = [];
    for (let i = 0; i < cards.length; i++) {
        const correctAttr = cards[i].a;
        // Pick 3 random wrong answers
        const options = [...cards];
        options.splice(i, 1); // remove correct answer temporarily
        options.sort(() => Math.random() - 0.5); // shuffle for random wrong answers
        
        const answers = [correctAttr, options[0].a, options[1].a, options[2].a];
        // The mod shuffles indices natively on execution. 
        // Index 0 represents the absolute baseline!
        output.push({
            text: cards[i].q,
            answers: answers,
            correctIndex: 0
        });
    }
    
    const blob = new Blob([JSON.stringify(output, null, 4)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'flashcards.json';
    a.click();
}
</script>
</body>
</html>
